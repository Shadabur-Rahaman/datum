project_id = "datum"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["https://shadabur-rahaman.github.io/datum/"]
enable_signup = true
[auth.email]
enable_signup = true
enable_confirmations = true
[auth.email.template.magic_link]
subject = "Your DATUM sign-in code"
content_path = "./supabase/templates/otp.html"

[functions.mentor]
verify_jwt = true
[functions.delete-account]
verify_jwt = true
