name: Deploy DATUM to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate authenticated Edge Function boundaries
        run: |
          deno check supabase/functions/mentor/index.ts supabase/functions/delete-account/index.ts
          deno test --allow-env supabase/functions/boundaries_test.ts
      - name: Test real PostgreSQL ownership rules
        run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - name: Test production routes, real Python, evidence recovery and accessibility
        run: npm run test:e2e
      - run: npm run build:pages
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
